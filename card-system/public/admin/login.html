<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>登录 · 卡密发放后台</title>
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="has-orbs" style="position:relative;min-height:100vh;overflow-x:hidden">
  <div class="fx-orbs" style="position:fixed;inset:0;z-index:0"><i></i><i></i><i></i></div>
  <div class="page" style="max-width:400px;padding-top:10vh;padding-bottom:40px;position:relative;z-index:1">
    <div style="text-align:center;margin-bottom:28px">
      <div class="stat-icon fx-breathe" style="width:46px;height:46px;margin:0 auto">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M12 2v6"></path><path d="M16.24 7.76l-4.24 4.24"></path><path d="M7.76 7.76 12 12"></path><path d="M2 12h6"></path><path d="M16 12h6"></path><path d="M12 16v6"></path></svg>
      </div>
      <h1 class="page-title" id="siteName" style="font-size:22px;margin-top:14px">卡密发放后台</h1>
      <p class="page-sub">登录以管理项目与卡密发放</p>
    </div>

    <div class="card fx-glass">
      <form id="loginForm">
        <div class="field">
          <label>用户名</label>
          <input class="input fx-focus-breathe" id="username" type="text" placeholder="请输入用户名" autocomplete="username" value="admin"/>
        </div>
        <div class="field">
          <label>密码</label>
          <input class="input fx-focus-breathe" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" autofocus/>
        </div>
        <button class="btn primary fx-shimmer" type="submit" id="btn" style="width:100%;padding:11px;font-size:14px">登 录</button>
      </form>
    </div>
    <p class="weak" style="text-align:center;font-size:12px;margin-top:16px">管理员 / 普通用户 · 密码登录</p>
  </div>

  <script src="/admin/js/common.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/admin/js/login.js"></script>
  <script>
    // 登录页没有底部 dock，主题切换放右上角
    (function () {
      const btn = document.createElement("button");
      btn.className = "dock-btn theme-toggle";
      btn.title = "切换亮 / 暗主题";
      btn.style.cssText = "position:fixed;top:16px;right:16px;z-index:50";
      btn.innerHTML = '<svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>'
        + '<svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
      btn.onclick = () => window.toggleTheme();
      document.body.appendChild(btn);
    })();
  </script>
</body>
</html>
