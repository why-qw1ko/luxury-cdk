<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>登录 · 卡密发放后台</title>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
  <div class="page" style="max-width:400px;padding-top:10vh;padding-bottom:40px">
    <div style="text-align:center;margin-bottom:28px">
      <div class="stat-icon" style="width:46px;height:46px;margin:0 auto">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:22px;height:22px"><path d="M12 2v6"></path><path d="M16.24 7.76l-4.24 4.24"></path><path d="M7.76 7.76 12 12"></path><path d="M2 12h6"></path><path d="M16 12h6"></path><path d="M12 16v6"></path></svg>
      </div>
      <h1 class="page-title" style="font-size:22px;margin-top:14px">卡密发放后台</h1>
      <p class="page-sub">登录以管理项目与卡密发放</p>
    </div>

    <div class="card">
      <form id="loginForm">
        <div class="field">
          <label>用户名</label>
          <input class="input" id="username" type="text" placeholder="请输入用户名" autocomplete="username" value="admin"/>
        </div>
        <div class="field">
          <label>密码</label>
          <input class="input" id="password" type="password" placeholder="请输入密码" autocomplete="current-password" autofocus/>
        </div>
        <button class="btn primary" type="submit" id="btn" style="width:100%;padding:11px;font-size:14px">登 录</button>
      </form>
    </div>
    <p class="weak" style="text-align:center;font-size:12px;margin-top:16px">管理员 / 普通用户 · 密码登录</p>
  </div>

  <script src="/admin/js/common.js"></script>
  <script src="/admin/js/login.js"></script>
</body>
</html>
