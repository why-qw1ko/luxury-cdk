<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>用户管理 · 卡密发放后台</title>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body data-page="users">
  <div class="page">
    <header class="page-header">
      <div>
        <h1 class="page-title" id="pageTitle">管理人员，管理员</h1>
        <p class="page-sub">新增用户、封禁或限制账号，各用户仅能管理自己的项目与 CDK</p>
      </div>
      <button class="btn primary" id="newUser">+ 新增用户</button>
    </header>

    <div class="card" style="padding:12px 20px">
      <div class="table-wrap">
        <table class="tbl">
          <thead>
            <tr>
              <th>用户</th>
              <th>角色</th>
              <th>状态</th>
              <th>项目</th>
              <th>内容</th>
              <th>CDK</th>
              <th>已领取</th>
              <th>创建时间</th>
              <th style="text-align:right">操作</th>
            </tr>
          </thead>
          <tbody id="userRows">
            <tr><td colspan="9" class="weak" style="text-align:center">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="dock"></div>
  <script src="/admin/js/common.js"></script>
  <script src="/admin/js/users.js"></script>
</body>
</html>
